<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPTD SDN 18 Negeri Katon - Kelulusan</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#04142f,#0a2f73);
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
}

.logo{
width:140px;
height:auto;
margin:20px auto;
display:block;
}

h1{
font-size:42px;
margin-bottom:10px;
}

.subtitle{
font-size:22px;
opacity:.9;
margin-bottom:25px;
}

.card{
background:white;
color:#222;
padding:30px;
border-radius:25px;
margin-top:30px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

#countdown{
font-size:32px;
font-weight:bold;
color:#0a2f73;
margin-top:15px;
}

input{
width:90%;
padding:15px;
font-size:18px;
border:2px solid #ddd;
border-radius:12px;
margin-top:15px;
}

button{
margin-top:15px;
padding:14px 25px;
border:none;
border-radius:12px;
background:#1565c0;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.sukses{
margin-top:20px;
padding:25px;
border-radius:20px;
background:linear-gradient(135deg,#16a34a,#2563eb);
color:white;
}

footer{
margin-top:50px;
opacity:.8;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" onerror="alert('Logo tidak ditemukan: pastikan nama file persis logo.png')" style="width:140px;display:block;margin:20px auto;">
<h1>🎓 UPTD SDN 18 NEGERI KATON</h1>

<div class="subtitle">
Portal Pengumuman Kelulusan<br>
Tahun Ajaran 2025/2026
</div>

<p>
Kepala Sekolah: SUJOKO S.Pd SD<br>
NIP: 197604082009021002
</p>

<div class="card">

<h2 id="judul">Pengumuman Belum Dibuka</h2>

<div id="countdown"></div>

<div id="cekArea" style="display:none">

<input id="nisn" placeholder="Masukkan NISN">

<br>

<button onclick="cek()">
Cek Kelulusan
</button>

<div id="hasil"></div>

</div>

</div>

<footer>
© 2026 UPTD SDN 18 Negeri Katon
</footer>

</div>

<script>

const buka = new Date("2026-06-05T08:00:00");

const data={

"132795839":{
nama:"AISY FITHRIYAH NURAINI",
kelas:"6",
status:"LULUS"
},

"132646830":{
nama:"ALFERO FACHRINSYAH ALBAR",
kelas:"6",
status:"LULUS"
},

"3147739871":{
nama:"Aqila Jihan Balqis",
kelas:"6",
status:"LULUS"
}

};

function update(){

let now=new Date();
let s=buka-now;

if(s<=0){

document.getElementById("judul").innerHTML="Cek Kelulusan";

document.getElementById("countdown").style.display="none";

document.getElementById("cekArea").style.display="block";

return;

}

let h=Math.floor(s/1000/60/60/24);
let j=Math.floor((s/1000/60/60)%24);
let m=Math.floor((s/1000/60)%60);
let d=Math.floor((s/1000)%60);

document.getElementById("countdown").innerHTML=
`${h} Hari ${j} Jam ${m} Menit ${d} Detik`;

}

setInterval(update,1000);
update();

function cek(){

let n=document.getElementById("nisn").value;

let h=document.getElementById("hasil");

if(data[n]){

h.innerHTML=`

<div class="sukses">

<h1>🎉 SELAMAT 🎉</h1>

<h2>${data[n].nama}</h2>

<p>Kelas ${data[n].kelas}</p>

<h1>${data[n].status}</h1>

<p>Selamat dan sukses ke jenjang berikutnya.</p>

<button onclick="window.print()">
Download SKL
</button>

</div>

`;

}else{

h.innerHTML="<h3 style='color:red'>Data tidak ditemukan</h3>";

}

}

</script>

</body>
</html>
