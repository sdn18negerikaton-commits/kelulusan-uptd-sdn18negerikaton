<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pengumuman Kelulusan UPTD SDN 18 Negeri Katon</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#04142f,#08285d);
color:white;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.logo{
width:140px;
margin-top:20px;
border-radius:50%;
box-shadow:0 0 30px rgba(255,255,255,.4);
}

.card{
background:white;
color:black;
padding:30px;
border-radius:25px;
margin-top:25px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
}

input{
width:80%;
padding:16px;
font-size:20px;
border-radius:15px;
border:2px solid #ddd;
}

button{
padding:16px 30px;
background:#1565c0;
border:none;
color:white;
font-size:18px;
border-radius:15px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#0d47a1;
}

#hasil{
margin-top:20px;
}

.sukses{
background:linear-gradient(135deg,#16a34a,#2563eb);
padding:30px;
border-radius:25px;
color:white;
box-shadow:0 15px 30px rgba(0,0,0,.3);
}

footer{
margin-top:50px;
padding:30px;
font-size:18px;
opacity:.9;
}

.count{
font-size:35px;
font-weight:bold;
margin:20px;
}

</style>
</head>

<body>

<div class="container">

<img class="logo"
src="https://i.imgur.com/J0mM6o5.png">

<h1>🎓 UPTD SDN 18 NEGERI KATON</h1>

<h2>Portal Pengumuman Kelulusan</h2>

<p>Tahun Ajaran 2025/2026</p>

<p>
Kepala Sekolah: SUJOKO S.Pd SD
<br>
NIP:197604082009021002
</p>


<div class="card">

<h2 id="judul">
Pengumuman Belum Dibuka
</h2>

<div id="countdown"></div>

<div id="cek" style="display:none">

<input
id="nisn"
placeholder="Masukkan NISN">

<br>

<button onclick="cek()">
Cek Kelulusan
</button>

<div id="hasil"></div>

</div>

</div>


<footer>

©2026 Portal Pengumuman Kelulusan
<br>
UPTD SDN 18 NEGERI KATON

</footer>

</div>


<script>

const buka=new Date("2026-06-05T08:00:00")

const data={

"132795839":{
nama:"AISY FITHRIYAH NURAINI",
kelas:"6",
status:"LULUS"
},

"132646830":{
nama:"ALFERO FACHRINSYAH ALBAR",
kelas:"6",
status:"LULUS"
},

"3147739871":{
nama:"Aqila Jihan Balqis",
kelas:"6",
status:"LULUS"
},

"3134779420":{
nama:"Candra Halim",
kelas:"6",
status:"LULUS"
}

}



function update(){

let sekarang=new Date()

let selisih=buka-sekarang

if(selisih<=0){

document.getElementById("judul")
.innerHTML="Cek Kelulusan"

document.getElementById("countdown")
.style.display="none"

document.getElementById("cek")
.style.display="block"

return

}

let hari=Math.floor(selisih/1000/60/60/24)

let jam=Math.floor(
(selisih/1000/60/60)%24)

let menit=Math.floor(
(selisih/1000/60)%60)

let detik=Math.floor(
(selisih/1000)%60)

document.getElementById(
"countdown"
).innerHTML=`

<div class="count">
${hari} Hari
${jam} Jam
${menit} Menit
${detik} Detik
</div>

`

}

setInterval(update,1000)

update()



function cek(){

let n=
document.getElementById("nisn").value

let h=
document.getElementById("hasil")

if(data[n]){

h.innerHTML=`

<div class='sukses'>

<h1>
🎉 SELAMAT 🎉
</h1>

<h2>
${data[n].nama}
</h2>

<h3>
Kelas ${data[n].kelas}
</h3>

<h1>
${data[n].status}
</h1>

<p>
Selamat atas kelulusan Anda.
Semoga sukses ke jenjang berikutnya.
</p>

<button onclick='window.print()'>
Download SKL
</button>

</div>

`

}else{

h.innerHTML=`
<h2 style='color:red'>
Data tidak ditemukan
</h2>
`

}

}

</script>

</body>
</html>
