<div style="margin-bottom:30px">

<p style="
font-size:20px">

Portal Pengumuman Kelulusan

</p>

<div class="card">
<h2 id="judul">Pengumuman belum dibuka</h2>

<div id="cek" style="display:none;">
<input id="nisn" placeholder="Masukkan NISN">
<br>
<button onclick="cek()">Cek Kelulusan</button>
<div id="hasil"></div>
</div>
</div>

<script>

const buka = new Date("2025-01-01T08:00:00");

const data = {

"132795839":{
nama:"AISY FITHRIYAH NURAINI",
kelas:"6",
status:"LULUS"
},

"132646830":{
nama:"ALFERO FACHRINSYAH ALBAR",
kelas:"6",
status:"LULUS"
},

"3147739871":{
nama:"Aqila Jihan Balqis",
kelas:"6",
status:"LULUS"
}

};

function update(){

if(new Date()>=buka){

document.getElementById("judul").innerHTML=
"🎓 Cek Kelulusan";

document.getElementById("cek").style.display=
"block";

}else{

document.getElementById("judul").innerHTML=
"⏳ Pengumuman belum dibuka";

}

}

function cek(){

let n=document.getElementById("nisn").value.trim();

let h=document.getElementById("hasil");

if(data[n]){

h.innerHTML=`

<div style="
margin-top:20px;
padding:25px;
border-radius:20px;
background:linear-gradient(135deg,#16a34a,#2563eb);
color:white">

<h1>🎉 SELAMAT 🎉</h1>

<h2>ANDA DINYATAKAN LULUS</h2>

<hr>

<h3>${data[n].nama}</h3>

<p>NISN : ${n}</p>

<p>Kelas : ${data[n].kelas}</p>

<p>Status:
<b style="color:yellow">
${data[n].status}
</b></p>

<button onclick="window.print()">

📄 Cetak / Simpan

</button>

</div>

`;

}else{

h.innerHTML="❌ Data tidak ditemukan";

}

}

update();
setInterval(update,1000);

</script>
