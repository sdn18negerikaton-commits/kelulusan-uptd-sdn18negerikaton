<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPTD SDN 18 Negeri Katon - Kelulusan</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0b1f4d,#1e3a8a);
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
}

.header{
margin:30px 0;
}

.header h1{
font-size:40px;
margin-bottom:10px;
}

.header p{
font-size:20px;
opacity:.95;
}

.card{
background:#fff;
color:#222;
padding:30px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.3);
margin-top:20px;
}

#countdown{
font-size:30px;
font-weight:bold;
color:#1e3a8a;
margin-top:15px;
}

input{
width:90%;
padding:15px;
font-size:18px;
border-radius:12px;
border:2px solid #ddd;
margin-top:15px;
}

button{
padding:14px 24px;
font-size:18px;
border:none;
border-radius:12px;
background:#1e40af;
color:white;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

.sukses{
margin-top:20px;
padding:25px;
border-radius:20px;
background:linear-gradient(135deg,#16a34a,#2563eb);
color:white;
}

footer{
margin-top:40px;
opacity:.85;
font-size:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<h1>🎓 UPTD SDN 18 NEGERI KATON</h1>

<p>
Portal Pengumuman Kelulusan<br>
Tahun Ajaran 2025/2026
</p>

<br>

<p>
Kepala Sekolah<br>
<b>SUJOKO S.Pd SD</b><br>
NIP. 197604082009021002
</p>

</div>

<div class="card">

<h2 id="judul">
Pengumuman Belum Dibuka
</h2>

<div id="countdown"></div>

<div id="cekArea" style="display:none">

<input
id="nisn"
placeholder="Masukkan NISN">

<br>

<button onclick="cek()">
Cek Kelulusan
</button>

<div id="hasil"></div>

</div>

</div>

<footer>
© 2026 UPTD SDN 18 Negeri Katon
</footer>

</div>

<script>

const buka =
new Date("2025-01-01");


const data={

"132795839":{
nama:"AISY FITHRIYAH NURAINI",
kelas:"6",
status:"LULUS"
},

"132646830":{
nama:"ALFERO FACHRINSYAH ALBAR",
kelas:"6",
status:"LULUS"
},

"3147739871":{
nama:"AQILA JIHAN BALQIS",
kelas:"6",
status:"LULUS"
},

"3134779420":{
nama:"CANDRA HALIM",
kelas:"6",
status:"LULUS"
}

};


function update(){

let now=new Date();

let s=buka-now;

if(s<=0){

document
.getElementById("judul")
.innerHTML="🎓 Cek Kelulusan";

document
.getElementById("countdown")
.style.display="none";

document
.getElementById("cekArea")
.style.display="block";

return;

}

let h=Math.floor(
s/1000/60/60/24
);

let j=Math.floor(
(s/1000/60/60)%24
);

let m=Math.floor(
(s/1000/60)%60
);

let d=Math.floor(
(s/1000)%60
);

document
.getElementById("countdown")
.innerHTML=

`${h} Hari ${j} Jam ${m} Menit ${d} Detik`;

}

setInterval(update,1000);

update();


function cek(){

let n=
document
.getElementById("nisn")
.value.trim();

let h=
document
.getElementById("hasil");

if(data[n]){

h.innerHTML=`

<div class="sukses">

<h1>
🎉 SELAMAT 🎉
</h1>

<h2>
${data[n].nama}
</h2>

<p>
Kelas ${data[n].kelas}
</p>

<h1>
${data[n].status}
</h1>

<p>
Selamat atas kelulusan Anda.
Semoga sukses ke jenjang berikutnya.
</p>

<button onclick="window.print()">
📄 Download SKL
</button>

</div>

`;

}else{

h.innerHTML=
"<h3 style='color:red'>Data tidak ditemukan</h3>";

}

}

</script>

</body>
</html>
